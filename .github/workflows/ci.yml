name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify public operator template
        run: ./scripts/verify.sh
      - name: Verify fresh VPS deployment layout
        run: sudo ./tests/smoke_deployment.sh
