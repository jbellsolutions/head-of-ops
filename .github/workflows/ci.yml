name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify public operator template
        run: ./scripts/verify.sh
      - name: Verify fresh VPS deployment layout
        run: sudo ./tests/smoke_deployment.sh

  reviewed-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the exact Head of Ops image
        run: docker build --pull -f hermes-image/Dockerfile -t head-of-ops-hermes:ci .
      - name: Prove Hermes and the Slack Agent manifest
        run: |
          docker run --rm --entrypoint /opt/hermes/.venv/bin/hermes \
            head-of-ops-hermes:ci --version
          docker run --rm --entrypoint /opt/hermes/.venv/bin/hermes \
            head-of-ops-hermes:ci slack manifest --agent-view \
            > /tmp/slack-manifest.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("/tmp/slack-manifest.json").read_text())
          assert "agent_view" in manifest["features"]
          assert "assistant:write" in manifest["oauth_config"]["scopes"]["bot"]
          assert len(manifest["features"]["slash_commands"]) == 50
          PY
