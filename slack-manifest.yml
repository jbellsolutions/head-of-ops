_metadata:
  major_version: 1
  minor_version: 1
display_information:
  name: Head of Ops
  description: Your private hosted Head of Ops AI Operator
  background_color: "#1a1a2e"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Head of Ops
    always_online: true
  slash_commands:
    - command: /hermes
      description: Talk to the Operator or run a subcommand
      usage_hint: "[subcommand] [args]"
      should_escape: false
      url: https://hermes-agent.local/slack/commands
    - command: /new
      description: Start a fresh session
      usage_hint: "[name]"
      should_escape: false
      url: https://hermes-agent.local/slack/commands
    - command: /stop
      description: Stop running background work
      should_escape: false
      url: https://hermes-agent.local/slack/commands
    - command: /approve
      description: Approve a pending dangerous command
      usage_hint: "[session|always]"
      should_escape: false
      url: https://hermes-agent.local/slack/commands
    - command: /deny
      description: Deny a pending dangerous command
      usage_hint: "[all] [reason]"
      should_escape: false
      url: https://hermes-agent.local/slack/commands
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - channels:read
      - chat:write
      - commands
      - files:read
      - files:write
      - groups:history
      - groups:read
      - im:history
      - im:read
      - im:write
      - mpim:history
      - mpim:read
      - reactions:read
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.channels
      - message.groups
      - message.im
      - message.mpim
      - reaction_added
      - reaction_removed
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
